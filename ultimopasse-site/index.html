<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Último Passe</title>
<meta name="description" content="Último Passe: notícias e histórias do futebol, com a fonte sempre creditada.">
<meta name="theme-color" content="#111111">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Último Passe">
<meta property="og:title" content="Último Passe">
<meta property="og:description" content="Notícias e histórias do futebol, com a fonte sempre creditada.">
<meta property="og:locale" content="pt_BR">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111111'/%3E%3Ctext x='8' y='44' font-family='Arial Black,Arial' font-weight='900' font-size='30' fill='%23ffffff'%3EUP%3C/text%3E%3Ccircle cx='54' cy='41' r='4' fill='%23C8F03C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Último Passe: papel branco, tinta preta, verde-limão só como sinal. Layout: coluna de leitura de jornal, mobile primeiro. */
  --paper: #FFFFFF;
  --ink: #111111;
  --muted: #5C5C5C;
  --line: #E4E4E2;
  --soft: #F4F4F2;
  --accent: #C8F03C;
  --display: 'Archivo Black', 'Arial Black', Impact, sans-serif;
  --body: 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --wrap: 1080px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55; }
a { color: inherit; }
img { max-width: 100%; display: block; }
h1, h2, h3 { text-wrap: balance; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* Topo */
.top { position: sticky; top: 0; z-index: 10; background: var(--paper); border-bottom: 2px solid var(--ink); }
.top-in { max-width: var(--wrap); margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.mono { display: inline-flex; align-items: flex-end; gap: 3px; font-family: var(--display); font-size: 30px; line-height: 0.8; letter-spacing: -1.5px; }
.mono i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 1px var(--ink) inset; }
.brand-name { font-family: var(--display); font-size: 15px; letter-spacing: 1px; text-transform: uppercase; }
.ig { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1.5px solid var(--ink); border-radius: 999px; font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap; }
.ig:hover { background: var(--ink); color: var(--paper); }
.ig svg { width: 18px; height: 18px; }

.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 20px; }

/* Home */
.intro { padding: 36px 0 20px; display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); }
.intro h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(34px, 7vw, 56px); line-height: 1; text-transform: uppercase; letter-spacing: -1px; }

.tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0 24px; border-bottom: 1px solid var(--line); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); font: 600 14px var(--body); cursor: pointer; }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.search { position: relative; flex: 1 1 220px; max-width: 320px; }
.search input { width: 100%; min-height: 44px; padding: 0 14px 0 42px; border: 1.5px solid var(--line); border-radius: 999px; font: 500 15px var(--body); color: var(--ink); background: var(--paper); }
.search input:focus { outline: none; border-color: var(--ink); }
.search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }

.tag { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; white-space: nowrap; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
.tag b { background: var(--ink); color: var(--paper); padding: 5px 9px; border-radius: 3px; font-weight: 700; }
.tag span { color: var(--muted); }

/* Destaque */
.feature { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; padding: 28px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
@media (min-width: 820px) { .feature { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 36px; align-items: center; } }
.feature h2 { margin: 12px 0 10px; font-family: var(--display); font-weight: 400; font-size: clamp(28px, 4.6vw, 44px); line-height: 1.02; text-transform: uppercase; letter-spacing: -0.5px; }
.feature p { margin: 0; color: var(--muted); font-size: 18px; }
.feature:hover h2, .row:hover h3 { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 5px; }

.cover { position: relative; aspect-ratio: 10 / 7; background: var(--soft); overflow: hidden; border-radius: 6px; }
.cover img { width: 100%; height: 100%; object-fit: cover; }
.cover-score { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; padding: 20px; text-align: center; background: var(--ink); color: var(--paper); }
.cover-score .teams { display: flex; align-items: center; gap: clamp(10px, 3vw, 22px); font-family: var(--display); text-transform: uppercase; font-size: clamp(16px, 3vw, 24px); }
.cover-score .score { font-size: clamp(54px, 11vw, 96px); line-height: 1; letter-spacing: -2px; }
.cover-score .comp { font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #CFCFCF; display: flex; align-items: center; gap: 8px; }
.cover-score .comp i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

/* Lista */
.list { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 128px; gap: 18px; padding: 22px 0; border-bottom: 1px solid var(--line); text-decoration: none; align-items: start; }
@media (min-width: 820px) { .row { grid-template-columns: minmax(0, 1fr) 220px; gap: 32px; } }
.row h3 { margin: 10px 0 6px; font-family: var(--display); font-weight: 400; font-size: clamp(19px, 2.6vw, 26px); line-height: 1.08; text-transform: uppercase; }
.row p { margin: 0; color: var(--muted); font-size: 15px; }
.row .cover { border-radius: 4px; }
.row .cover-score .teams > span:not(.score) { display: none; }
.row .cover-score .score { font-size: clamp(30px, 5vw, 48px); }
.row .cover-score .comp { display: none; }
.meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { padding: 48px 0; color: var(--muted); }
.empty button { margin-top: 12px; }

/* Matéria */
.article { max-width: 720px; margin: 0 auto; padding: 24px 20px 40px; }
.back { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-weight: 600; font-size: 15px; text-decoration: none; }
.back:hover { text-decoration: underline; }
.article h1 { margin: 14px 0 12px; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 6.5vw, 50px); line-height: 1.02; text-transform: uppercase; letter-spacing: -0.5px; }
.dek { margin: 0 0 14px; font-size: 20px; line-height: 1.45; color: var(--muted); }
.byline { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 24px; }
figure { margin: 0 0 28px; }
figcaption { margin-top: 8px; font-size: 13px; color: var(--muted); }
.body p { margin: 0 0 20px; font-size: 18px; line-height: 1.7; max-width: 65ch; }
.body blockquote { margin: 28px 0; padding: 4px 0 4px 0; font-family: var(--body); font-weight: 700; font-size: clamp(22px, 4vw, 28px); line-height: 1.3; }
.body blockquote::before { content: "“"; display: block; font-family: var(--display); font-size: 72px; line-height: 0.6; height: 34px; }
.body blockquote cite { display: block; margin-top: 12px; font-style: normal; font-weight: 500; font-size: 15px; color: var(--muted); }
.source { margin-top: 32px; padding: 18px 20px; background: var(--soft); border-radius: 6px; font-size: 15px; display: flex; flex-direction: column; gap: 6px; }
.source strong { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
.source a { font-weight: 600; }
.more { margin-top: 44px; }
.more h2 { margin: 0 0 4px; font-family: var(--display); font-weight: 400; font-size: 20px; text-transform: uppercase; }

/* Rodapé */
.foot { margin-top: 56px; background: var(--ink); color: var(--paper); }
.foot-in { max-width: var(--wrap); margin: 0 auto; padding: 40px 20px 48px; display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: flex-end; }
.foot .mono { font-size: 54px; letter-spacing: -3px; }
.foot .mono i { width: 12px; height: 12px; box-shadow: none; }
.foot p { margin: 12px 0 0; color: #CFCFCF; max-width: 40ch; font-size: 15px; }
.foot .ig { border-color: var(--paper); }
.foot .ig:hover { background: var(--paper); color: var(--ink); }

@media (max-width: 480px) {
  .brand-name { display: none; }
  .row { grid-template-columns: minmax(0, 1fr) 104px; gap: 14px; }
  .row p { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .view { animation: in .25s ease-out; }
  @keyframes in { from { transform: translateY(6px); } to { transform: none; } }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#inicio" aria-label="Último Passe, página inicial">
      <span class="mono" aria-hidden="true">UP<i></i></span>
      <span class="brand-name">Último Passe</span>
    </a>
    <a class="ig" href="https://www.instagram.com/ultimopasseoficial/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle></svg>
      @ultimopasseoficial
    </a>
  </div>
</header>

<main id="app"></main>

<footer class="foot">
  <div class="foot-in">
    <div>
      <span class="mono" aria-hidden="true">UP<i></i></span>
      <p>Último Passe. Notícias e histórias do futebol, com a fonte sempre creditada.</p>
    </div>
    <a class="ig" href="https://www.instagram.com/ultimopasseoficial/" target="_blank" rel="noopener">Siga no Instagram</a>
  </div>
</footer>

<script>
/* Para publicar uma nova matéria, adicione um objeto no início desta lista. */
const MATERIAS = [
  {
    slug: 'raphinha-camisa-9',
    editoria: 'Internacional',
    competicao: 'LaLiga',
    data: '2026-11-02',
    titulo: 'Raphinha brilha de camisa 9 e ganha elogios de Flick',
    linhaFina: '17 gols em 12 jogos na temporada e artilheiro isolado de LaLiga.',
    capa: { tipo: 'foto', src: 'img/raphinha.jpg', alt: 'Raphinha e Lamine Yamal comemoram no gramado do Barcelona', credito: 'Foto: Albert Gea / Reuters' },
    corpo: [
      { p: 'Raphinha soma 17 gols em 12 jogos na temporada atuando como centroavante do Barcelona. Em LaLiga, são 15 gols em 10 partidas, o que faz dele o artilheiro isolado da competição.' },
      { p: 'O brasileiro, que ao longo da carreira atuou pelos lados do campo, passou a ser usado no comando do ataque depois que o clube não conseguiu contratar um substituto para Lewandowski na última janela de transferências. O principal alvo era Julián Álvarez, do Atlético de Madrid, mas as negociações não avançaram.' },
      { p: 'No último fim de semana, o atacante de 29 anos marcou duas vezes na vitória por 6 a 1 sobre o Alavés, resultado que manteve o Barcelona na liderança do Campeonato Espanhol.' },
      { citacao: 'Ele está jogando em um nível espetacular.', autor: 'Hansi Flick, técnico do Barcelona, em entrevista coletiva' },
      { p: 'Na coletiva desta segunda-feira, Flick também destacou que as características de Raphinha se encaixam no estilo de jogo da equipe e ressaltou o foco e a liderança do jogador, que é o capitão do time.' },
      { p: 'O Barcelona enfrenta o Aston Villa nesta terça-feira (3), às 17h (de Brasília), pela 4ª rodada da fase de liga da Champions League. O time inglês, comandado por Unai Emery, tem 100% de aproveitamento, com 9 pontos. O Barça, derrotado pelo PSG na rodada anterior, soma 6.' }
    ],
    fontes: [
      { nome: 'ge', url: 'https://ge.globo.com/futebol/futebol-internacional/noticia/2026/11/02/tecnico-do-barcelona-se-rende-a-raphinha-de-9-nivel-espetacular.ghtml' }
    ]
  },
  {
    slug: 'evangelista-lance-polemico',
    editoria: 'Nacional',
    competicao: 'Copa do Brasil',
    data: '2026-11-02',
    titulo: 'Lucas Evangelista explica gesto em lance de possível pênalti para o Vasco',
    linhaFina: 'Meia do Palmeiras disse ter visto a bola bater na mão do adversário. O Palmeiras venceu por 1 a 0 a ida da semifinal.',
    capa: { tipo: 'placar', mandante: 'Palmeiras', visitante: 'Vasco', placar: '1×0', legenda: 'Copa do Brasil · Semifinal · Ida' },
    corpo: [
      { p: 'O meia Lucas Evangelista, do Palmeiras, explicou nas redes sociais o gesto feito durante um lance de possível pênalti na vitória por 1 a 0 sobre o Vasco, no domingo (1º), no Nubank Parque, pela partida de ida da semifinal da Copa do Brasil. Maurício marcou o gol do jogo.' },
      { p: 'Aos 4 minutos do segundo tempo, após uma disputa entre Lescano e Barboza, a bola tocou na mão do zagueiro palmeirense dentro da área. Evangelista sinalizou toque de mão, e o gesto foi interpretado nas redes como um pedido de pênalti contra o próprio time.' },
      { citacao: 'Eu juro que vi a bola batendo na mão do jogador deles, rapaziada. Foi mal.', autor: 'Lucas Evangelista, nas redes sociais' },
      { p: 'O árbitro Anderson Daronco mandou o jogo seguir, e o VAR não recomendou a revisão do lance. Após a partida, a diretoria do Vasco criticou a arbitragem. O Vasco terminou o jogo com um jogador a menos, após a expulsão de Saldivia.' },
      { p: 'No jogo de volta, o Vasco precisa vencer por dois gols de diferença para se classificar no tempo normal. Uma vitória por um gol leva a decisão para os pênaltis. O vencedor do confronto enfrenta Grêmio ou Atlético-MG na final.' }
    ],
    fontes: [
      { nome: 'ge', url: 'https://ge.globo.com/futebol/times/palmeiras/noticia/2026/11/01/reacao-de-lucas-evangelista-viraliza-em-lance-polemico-de-palmeiras-x-vasco-veja.ghtml' },
      { nome: 'Lance!', url: 'https://www.lance.com.br/fora-de-campo/evangelista-responde-torcedores-apos-gesto-em-palmeiras-x-vasco-eu-juro.html' }
    ]
  }
];

const EDITORIAS = ['Todas', 'Internacional', 'Nacional'];
const app = document.getElementById('app');
let filtro = 'Todas';
let busca = '';
try { filtro = sessionStorage.getItem('up-filtro') || 'Todas'; } catch (e) {}

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const dataLonga = (iso) => { const [a, m, d] = iso.split('-').map(Number); return d + ' de ' + meses[m - 1] + ' de ' + a; };
const semAcento = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function capa(m, grande) {
  const c = m.capa;
  if (c.tipo === 'foto') {
    return '<div class="cover"><img src="' + esc(c.src) + '" alt="' + esc(c.alt) + '" loading="' + (grande ? 'eager' : 'lazy') + '"></div>';
  }
  return '<div class="cover cover-score" role="img" aria-label="' + esc(c.mandante + ' ' + c.placar.replace('×', ' a ') + ' ' + c.visitante) + '">' +
    '<div class="teams"><span>' + esc(c.mandante) + '</span><span class="score">' + esc(c.placar) + '</span><span>' + esc(c.visitante) + '</span></div>' +
    '<div class="comp"><i aria-hidden="true"></i>' + esc(c.legenda) + '</div></div>';
}
const tag = (m) => '<span class="tag"><b>' + esc(m.competicao) + '</b><span>' + esc(m.editoria) + '</span></span>';

function listaFiltrada() {
  const q = semAcento(busca.trim());
  return MATERIAS.filter((m) => (filtro === 'Todas' || m.editoria === filtro) &&
    (!q || semAcento([m.titulo, m.linhaFina, m.competicao, m.editoria].join(' ')).includes(q)));
}

function linha(m) {
  return '<a class="row" href="#' + m.slug + '"><div>' + tag(m) + '<h3>' + esc(m.titulo) + '</h3><p>' + esc(m.linhaFina) + '</p>' +
    '<div class="meta" style="margin-top:8px">' + dataLonga(m.data) + '</div></div>' + capa(m, false) + '</a>';
}

function renderInicio(manterFoco) {
  const itens = listaFiltrada();
  let html = '<div class="view"><div class="wrap">' +
    '<section class="intro"><span class="eyebrow">Notícias e histórias do futebol</span><h1>Últimas notícias</h1></section>' +
    '<div class="tools"><div class="chips" role="group" aria-label="Filtrar por editoria">' +
    EDITORIAS.map((e) => '<button class="chip" type="button" data-filtro="' + e + '" aria-pressed="' + (e === filtro) + '">' + e + '</button>').join('') +
    '</div><label class="search" for="busca"><span class="sr-only">Buscar notícias</span>' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>' +
    '<input id="busca" type="search" placeholder="Buscar jogador, time, campeonato" value="' + esc(busca) + '" autocomplete="off"></label></div>';

  if (!itens.length) {
    html += '<div class="empty"><p>Nenhuma notícia encontrada para essa busca.</p><button class="chip" type="button" id="limpar">Limpar busca e filtros</button></div>';
  } else {
    const [primeira, ...resto] = itens;
    html += '<a class="feature" href="#' + primeira.slug + '">' + capa(primeira, true) +
      '<div>' + tag(primeira) + '<h2>' + esc(primeira.titulo) + '</h2><p>' + esc(primeira.linhaFina) + '</p>' +
      '<div class="meta" style="margin-top:12px">' + dataLonga(primeira.data) + '</div></div></a>';
    html += '<div class="list">' + resto.map(linha).join('') + '</div>';
  }
  html += '</div></div>';
  app.innerHTML = html;

  app.querySelectorAll('[data-filtro]').forEach((b) => b.addEventListener('click', () => {
    filtro = b.dataset.filtro;
    try { sessionStorage.setItem('up-filtro', filtro); } catch (e) {}
    renderInicio();
    const alvo = app.querySelector('[data-filtro="' + filtro + '"]'); if (alvo) alvo.focus();
  }));
  const input = document.getElementById('busca');
  input.addEventListener('input', () => {
    busca = input.value;
    const pos = input.selectionStart;
    renderInicio(true);
    const novo = document.getElementById('busca'); novo.focus(); try { novo.setSelectionRange(pos, pos); } catch (e) {}
  });
  const limpar = document.getElementById('limpar');
  if (limpar) limpar.addEventListener('click', () => { busca = ''; filtro = 'Todas'; renderInicio(); });
  document.title = 'Último Passe';
}

function renderMateria(m) {
  const corpo = m.corpo.map((b) => b.p
    ? '<p>' + esc(b.p) + '</p>'
    : '<blockquote>' + esc(b.citacao) + '<cite>' + esc(b.autor) + '</cite></blockquote>').join('');
  const fontes = m.fontes.map((f) => '<a href="' + esc(f.url) + '" target="_blank" rel="noopener">' + esc(f.nome) + '</a>').join(' · ');
  const outras = MATERIAS.filter((x) => x.slug !== m.slug).slice(0, 3);
  const credito = m.capa.tipo === 'foto' ? '<figcaption>' + esc(m.capa.credito) + '</figcaption>' : '';

  app.innerHTML = '<div class="view"><article class="article">' +
    '<a class="back" href="#inicio"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Todas as notícias</a>' +
    '<div style="margin-top:12px">' + tag(m) + '</div>' +
    '<h1>' + esc(m.titulo) + '</h1><p class="dek">' + esc(m.linhaFina) + '</p>' +
    '<div class="byline meta"><span>' + dataLonga(m.data) + '</span><span>Redação Último Passe</span><span>Informações: ' + m.fontes.map((f) => esc(f.nome)).join(' e ') + '</span></div>' +
    '<figure>' + capa(m, true) + credito + '</figure>' +
    '<div class="body">' + corpo + '</div>' +
    '<aside class="source"><strong>Fonte</strong><span>Matéria produzida com informações de ' + fontes + '.</span></aside>' +
    (outras.length ? '<section class="more"><h2>Mais notícias</h2><div class="list">' + outras.map(linha).join('') + '</div></section>' : '') +
    '</article></div>';
  document.title = m.titulo + ' | Último Passe';
}

function rota() {
  const slug = location.hash.replace('#', '');
  const m = MATERIAS.find((x) => x.slug === slug);
  if (m) { renderMateria(m); } else { renderInicio(); }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', rota);
rota();
</script>
</body>
</html>
